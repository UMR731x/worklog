name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有版本标签，例如 v0.4.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Build executables
        run: |
          sh build.sh
          mkdir -p dist/release
          cp dist/linux-amd64/worklog dist/release/linux-x86_64.bin
          cp dist/windows-amd64/worklog.exe dist/release/windows-x86_64.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "docs/releases/${VERSION}.md" dist/release/notes.md
          cat >> dist/release/notes.md <<'EOF'

          <details>
          <summary>第三方许可</summary>

          EOF
          cat THIRD_PARTY_NOTICES.md >> dist/release/notes.md
          printf '\n</details>\n' >> dist/release/notes.md
          gh release create "$VERSION" \
            dist/release/linux-x86_64.bin \
            dist/release/windows-x86_64.exe \
            --verify-tag \
            --title "Worklog $VERSION" \
            --notes-file dist/release/notes.md
